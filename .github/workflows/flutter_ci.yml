name: Build and verify VastuSign

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Optional deployed API URL, for example https://api.example.com
        required: false
        type: string

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        run: |
          flutter create --platforms=android --org com.vastusign --project-name vastusign .
          rm -f test/widget_test.dart

      - name: Apply Android production settings
        run: python3 tool/prepare_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Normalize formatting
        run: dart format lib test

      - name: Analyse source
        continue-on-error: true
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Check backend syntax
        run: npm run check --prefix backend

      - name: Build installable APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VastuSign-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
