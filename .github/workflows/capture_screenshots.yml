name: Capture Android screenshots

on:
  push:
    paths:
      - .github/workflows/capture_screenshots.yml
      - test/screenshot_test.dart
      - lib/src/features/analysis/presentation/category_page.dart
      - lib/src/features/home/presentation/home_page.dart
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Render production widgets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          flutter pub get
          mkdir -p test/goldens
          flutter test --update-goldens test/screenshot_test.dart

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: VastuSign-App-Screenshots
          path: test/goldens/*.png
          if-no-files-found: error
          retention-days: 30
